name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build pinned native simplifier
        run: python tools/build_native.py
      - name: Verify native build and exports
        run: python tools/build_native.py --check
      - name: Native build tool tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Engine and job policy tests
        run: python -m unittest discover -s tests -v
      - name: Browser unit tests
        run: node --test
      - name: Original real-geometry CLI smoke
        run: |
          python run.py demo --out results/demo
          python run.py inspect results/demo/original-reactor.glb --out results/inspect
          python run.py prepare results/demo/original-reactor.glb --out results/prepared
